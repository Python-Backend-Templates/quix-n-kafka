networks:
  network:
    name: ${PROJECT_NAME}-network

services:
  zookeeper:
    extends:
      file: docker-compose.yml
      service: zookeeper

  kafka:
    extends:
      file: docker-compose.yml
      service: kafka

  schema-registry:
    extends:
      file: docker-compose.yml
      service: schema-registry

  producer:
    extends:
      file: docker-compose.yml
      service: producer
    volumes:
      - ../producer/:/apps/

  consumer:
    extends:
      file: docker-compose.yml
      service: consumer
    volumes:
      - ../consumer/:/apps/
